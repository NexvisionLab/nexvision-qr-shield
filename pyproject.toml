[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvision-qr-shield"
version = "5.0.1"
description = "Offline-first OSINT QR-code decoding and explainable safety analysis"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "NexVision Lab"}]
keywords = ["osint", "qr-code", "phishing", "cybersecurity", "fraud-detection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.53.0",
  "python-multipart==0.0.32",
  "jinja2==3.1.6",
  "opencv-python-headless==4.12.0.88",
  "pillow==12.3.0",
  "numpy==2.2.6",
  "tldextract==5.3.2",
  "idna==3.20",
  "zxing-cpp==2.3.0",
]

[project.optional-dependencies]
enhanced-decoder = []
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.138.15", "httpx2==2.13.0"]

[project.scripts]
nexvision-qr-shield = "app.cli:main"

[project.urls]
Homepage = "https://github.com/NexvisionLab/nexvision-qr-shield"
Repository = "https://github.com/NexvisionLab/nexvision-qr-shield"
Issues = "https://github.com/NexvisionLab/nexvision-qr-shield/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "data/*.txt", "static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
