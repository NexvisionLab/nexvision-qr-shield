# Ingress for docker-compose.yml. The app container has no network egress;
# this proxy is the only container on both the internal and ingress networks.
upstream qr_shield {
    server qr-shield:8000;
    keepalive 8;
}

server {
    listen 8080;
    server_tokens off;

    # Matches the application's 20 MB artifact limit plus multipart overhead.
    client_max_body_size 21m;
    client_body_timeout 30s;

    location / {
        proxy_pass http://qr_shield;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not
        # choose the address the application rate-limits on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
