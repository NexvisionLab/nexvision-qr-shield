services:
  qr-shield:
    build: .
    # No published port: the app sits only on the internal "shield" network,
    # which has no route out. The proxy below is the only way in.
    environment:
      QR_SHIELD_BLOCKLIST: "${QR_SHIELD_BLOCKLIST:-}"
      QR_SHIELD_ENV: "${QR_SHIELD_ENV:-production}"
      QR_SHIELD_ALLOWED_HOSTS: "${QR_SHIELD_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      QR_SHIELD_API_KEY: "${QR_SHIELD_API_KEY:-}"
      QR_SHIELD_REPORT_HMAC_KEY: "${QR_SHIELD_REPORT_HMAC_KEY:-}"
      QR_SHIELD_ALLOW_NETWORK_PREFLIGHT: "${QR_SHIELD_ALLOW_NETWORK_PREFLIGHT:-0}"
      QR_SHIELD_OCR: "${QR_SHIELD_OCR:-1}"
      QR_SHIELD_REDACTION_LEVEL: "${QR_SHIELD_REDACTION_LEVEL:-personal}"
    # Trust X-Forwarded-For only from the proxy's fixed address so per-client
    # rate limiting sees real client IPs instead of the proxy.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.30.57.2
      - --limit-concurrency
      - "32"
      - --timeout-keep-alive
      - "5"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    networks:
      shield:
        ipv4_address: 172.30.57.10
    restart: unless-stopped

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    depends_on:
      - qr-shield
    ports:
      # Loopback only. Put TLS termination in front before exposing it.
      - "${QR_SHIELD_BIND:-127.0.0.1}:8000:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      shield:
        ipv4_address: 172.30.57.2
      ingress: {}
    restart: unless-stopped

networks:
  shield:
    internal: true
    ipam:
      config:
        - subnet: 172.30.57.0/24
  ingress: {}
