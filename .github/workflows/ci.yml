name: Security and test gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system decoders
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils tesseract-ocr
      - name: Install audit environment
        run: python -m pip install --requirement requirements-audit.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit runtime dependencies
        run: python -m pip_audit --requirement requirements.lock
      - name: Scan tracked content for secrets
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.venv|\.pytest_cache|\.ruff_cache|\.hypothesis|build|dist)/' > /tmp/detect-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/detect-secrets.json").read_text())
          findings = report.get("results", {})
          if findings:
              for path, items in sorted(findings.items()):
                  print(f"{path}: {len(items)} potential secret(s)")
              raise SystemExit("Potential secrets detected; publication blocked.")
          print("No potential secrets detected.")
          PY
      - name: Lint
        run: ruff check .
      - name: Static security analysis
        run: bandit -q -r app tools
      - name: Test
        run: pytest -q
