name: Security and test gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system decoders
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils tesseract-ocr
      - name: Install audit environment
        run: python -m pip install --requirement requirements-audit.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit runtime dependencies
        run: python -m pip_audit --requirement requirements.lock
      - name: Scan tracked content for secrets
        run: detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.venv|build|dist)/'
      - name: Lint
        run: ruff check .
      - name: Static security analysis
        run: bandit -q -r app tools
      - name: Test
        run: pytest -q
