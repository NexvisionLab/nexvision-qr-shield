version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # init and analyze must move together; a split bump fails CodeQL.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
